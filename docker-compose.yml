version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  product-pu:
    build: .
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis
    depends_on:
      - redis

  cart-pu:
    build: .
    ports:
      - "8082:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis
    depends_on:
      - redis

  order-pu:
    build: .
    ports:
      - "8083:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis
    depends_on:
      - redis

  inventory-pu:
    build: .
    ports:
      - "8084:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis
    depends_on:
      - redis

